<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interactive Wallpaper</title>
  <style>
    :root {
      color-scheme: dark;
      --bg-poster: url("https://i.ytimg.com/vi/3kYf4OCStJ8/maxresdefault.jpg");
      --panel: rgba(10, 12, 16, 0.36);
      --panel-strong: rgba(10, 12, 16, 0.52);
      --line: rgba(255, 255, 255, 0.18);
      --text: #f7fbff;
      --muted: rgba(235, 244, 247, 0.72);
      --accent: #f49b5f;
      --cool: #52c7d5;
      --shadow: 0 20px 70px rgba(0, 0, 0, 0.42);
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #080b0f;
      color: var(--text);
    }

    button,
    input {
      font: inherit;
    }

    .stage {
      position: fixed;
      inset: 0;
      isolation: isolate;
      background: #080b0f;
    }

    .video-wrap {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: -3;
      background: #080b0f;
      background-image: var(--bg-poster);
      background-position: center;
      background-size: cover;
      transition: background-image 0.5s ease;
    }

    .video-wrap iframe {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100vw;
      height: 56.25vw;
      min-width: 177.78vh;
      min-height: 100vh;
      transform: translate(-50%, -50%);
      border: 0;
      pointer-events: none;
      filter: saturate(1.05) contrast(1.04);
    }

    .ambient-fallback {
      position: absolute;
      inset: -4%;
      background:
        linear-gradient(110deg, rgba(20, 9, 42, .58), transparent 34%, rgba(245, 121, 57, .34) 58%, rgba(8, 13, 20, .46)),
        var(--bg-poster) center / cover no-repeat;
      transform: scale(1.04);
      animation: ambientDrift 18s ease-in-out infinite alternate;
      transition: background 0.5s ease;
    }

    .ambient-fallback::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(125deg, rgba(255, 255, 255, .05), transparent 38%),
        linear-gradient(270deg, transparent, rgba(244, 155, 95, .18), transparent);
      mix-blend-mode: screen;
      opacity: .75;
      animation: lightSweep 12s ease-in-out infinite alternate;
    }

    @keyframes ambientDrift {
      from {
        transform: scale(1.04) translate3d(-1.5%, 0, 0);
        filter: saturate(1.08) contrast(1.03);
      }

      to {
        transform: scale(1.1) translate3d(1.5%, -1%, 0);
        filter: saturate(1.22) contrast(1.08);
      }
    }

    @keyframes lightSweep {
      from {
        transform: translateX(-8%);
        opacity: .45;
      }

      to {
        transform: translateX(8%);
        opacity: .86;
      }
    }

    .wash {
      position: absolute;
      inset: 0;
      z-index: -2;
      background:
        linear-gradient(90deg, rgba(5, 7, 10, 0.42), rgba(5, 7, 10, 0.16) 46%, rgba(5, 7, 10, 0.74)),
        radial-gradient(circle at 72% 28%, rgba(255, 165, 96, 0.2), transparent 28%),
        linear-gradient(180deg, rgba(4, 6, 9, 0.25), rgba(4, 6, 9, 0.72));
    }

    .grain {
      position: absolute;
      inset: 0;
      z-index: -1;
      opacity: 0.08;
      background-image:
        linear-gradient(rgba(255, 255, 255, .4) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, .4) 1px, transparent 1px);
      background-size: 64px 64px;
      mask-image: linear-gradient(90deg, transparent, black 58%);
    }

    .rails-container {
      position: absolute;
      top: 24px;
      right: 24px;
      bottom: 24px;
      display: flex;
      gap: 16px;
      pointer-events: none;
      z-index: 10;
      max-height: calc(100vh - 48px);
    }

    .rail {
      width: min(410px, calc(50vw - 32px));
      display: grid;
      grid-template-rows: auto;
      gap: 12px;
      align-content: start;
      pointer-events: auto;
      height: 100%;
      overflow-y: auto;
      scrollbar-width: none;
      padding-bottom: 24px;
    }

    .rail::-webkit-scrollbar {
      display: none;
    }

    .financial-widget {
      height: 140px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .tradingview-widget-container,
    .tradingview-widget-container__widget,
    .tradingview-widget-container iframe {
      background: transparent !important;
      background-color: transparent !important;
    }

    .world-clocks {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .world-clock-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .world-clock-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .world-clock-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .world-clock-date {
      font-size: 13px;
      color: var(--muted);
    }

    .world-clock-time {
      font-size: 26px;
      font-weight: 300;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    .world-clock-divider {
      height: 1px;
      background: var(--line);
      opacity: 0.6;
    }

    .widget {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(24px) saturate(1.25);
    }

    .widget::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      background: linear-gradient(145deg, rgba(255, 255, 255, .14), transparent 42%);
    }

    .clock {
      padding: 22px 22px 20px;
      min-height: 154px;
    }

    .eyebrow {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--cool);
      box-shadow: 0 0 18px var(--cool);
    }

    .time {
      margin-top: 4px;
      font-size: clamp(48px, 7vh, 76px);
      line-height: 1;
      font-weight: 300;
      letter-spacing: 0;
      font-variant-numeric: tabular-nums;
    }

    .date {
      margin-top: 8px;
      color: var(--muted);
      font-size: 15px;
      text-transform: capitalize;
    }

    .calendar {
      padding: 16px;
    }

    .calendar-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .calendar-title {
      font-size: 18px;
      font-weight: 650;
      text-transform: capitalize;
    }

    .calendar-actions {
      display: flex;
      gap: 6px;
    }

    .icon-button {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, .18);
      border-radius: 7px;
      background: rgba(255, 255, 255, .08);
      color: var(--text);
      cursor: pointer;
    }

    .icon-button:hover {
      background: rgba(255, 255, 255, .15);
    }

    .month-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .day-name,
    .day {
      min-width: 0;
      height: 26px;
      display: grid;
      place-items: center;
      border-radius: 7px;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .day-name {
      height: 20px;
      color: rgba(245, 250, 252, .6);
      font-size: 11px;
      text-transform: uppercase;
    }

    .day {
      background: rgba(255, 255, 255, .06);
      color: rgba(255, 255, 255, .86);
    }

    .day.other {
      color: rgba(255, 255, 255, .28);
      background: rgba(255, 255, 255, .025);
    }

    .day.today {
      background: linear-gradient(135deg, var(--accent), #f15f72);
      color: white;
      font-weight: 700;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, .22) inset, 0 8px 24px rgba(244, 122, 96, .28);
    }

    .weather {
      display: grid;
      min-height: 480px;
      min-width: 320px;
      grid-template-rows: auto 1fr;
      background: var(--panel-strong);
    }

    .weather-head {
      padding: 10px 12px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, .1);
    }

    .weather-title {
      font-size: 15px;
      font-weight: 650;
      color: var(--text);
    }

    .weather-body {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 0;
    }

    .weather-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.04);
      padding: 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .weather-main {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .weather-temp {
      font-size: 32px;
      font-weight: 700;
      color: var(--text);
      font-family: inherit;
    }

    .weather-status {
      display: flex;
      flex-direction: column;
    }

    .weather-desc {
      font-size: 14px;
      font-weight: 600;
      color: var(--accent);
      text-transform: capitalize;
    }

    .weather-date {
      font-size: 12px;
      color: var(--muted);
    }

    .weather-icon {
      font-size: 32px;
      filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.2));
    }

    .weather-details {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      text-align: center;
    }

    .w-detail {
      background: rgba(255, 255, 255, 0.03);
      padding: 8px 4px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .wd-label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .wd-val {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }

    .thermal-map-container {
      flex-grow: 1;
      min-height: 220px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      position: relative;
    }

    .thermal-map-container iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: #111;
    }

    .hide {
      display: none;
    }

    @media (max-width: 900px) {
      .rails-container {
        top: 12px;
        right: 12px;
        bottom: 12px;
        left: 12px;
        flex-direction: column;
        overflow-y: auto;
      }

      .rail {
        width: 100%;
        height: auto;
        overflow-y: visible;
      }

      .clock {
        min-height: 132px;
        padding: 18px;
      }

      .time {
        font-size: 48px;
      }

      .financial-widget {
        height: 130px;
      }
    }

    /* Video Memory Pill & Switcher */
    .video-control-pill {
      position: fixed;
      bottom: 24px;
      left: 24px;
      z-index: 25;
      font-size: 13px;
      user-select: none;
    }

    .video-pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 9px 16px;
      border-radius: 999px;
      background: rgba(10, 12, 16, 0.48);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: var(--text);
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .video-pill-btn:hover {
      background: rgba(18, 22, 30, 0.72);
      border-color: rgba(244, 155, 95, 0.4);
      transform: translateY(-2px);
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.5);
    }

    .video-pill-icon {
      font-size: 14px;
    }

    .video-pill-title {
      font-weight: 600;
      letter-spacing: .02em;
      max-width: 200px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .video-pill-arrow {
      font-size: 9px;
      color: var(--muted);
      transition: transform 0.25s ease;
    }

    .video-pill-menu.open + .video-pill-btn .video-pill-arrow,
    .video-control-pill.is-open .video-pill-arrow {
      transform: rotate(180deg);
    }

    .video-pill-menu {
      position: absolute;
      bottom: calc(100% + 10px);
      left: 0;
      width: 320px;
      background: rgba(10, 13, 18, 0.92);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 16px;
      padding: 10px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
      opacity: 0;
      visibility: hidden;
      transform: translateY(10px) scale(0.97);
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .video-pill-menu.open {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
    }

    .video-pill-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 8px 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--accent);
    }

    .video-pill-badge {
      font-size: 10px;
      color: var(--muted);
      font-weight: 500;
      text-transform: none;
      letter-spacing: normal;
    }

    .video-pill-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 260px;
      overflow-y: auto;
      scrollbar-width: thin;
    }

    .video-pill-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 10px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text);
      cursor: pointer;
      width: 100%;
      text-align: left;
      transition: all 0.15s ease;
    }

    .video-pill-item:hover {
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(255, 255, 255, 0.12);
    }

    .video-pill-item.active {
      background: rgba(244, 155, 95, 0.14);
      border-color: rgba(244, 155, 95, 0.4);
    }

    .video-item-thumb {
      width: 48px;
      height: 28px;
      border-radius: 6px;
      object-fit: cover;
      background: #000;
      flex-shrink: 0;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .video-item-meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
      flex: 1;
    }

    .video-item-name {
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .video-item-desc {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .video-item-check {
      font-size: 13px;
      color: var(--accent);
      opacity: 0;
      flex-shrink: 0;
    }

    .video-pill-item.active .video-item-check {
      opacity: 1;
    }

    @media (max-width: 900px) {
      .video-control-pill {
        bottom: 12px;
        left: 12px;
      }
      .video-pill-menu {
        width: 290px;
      }
    }
  </style>
</head>

<body>
  <main class="stage">
    <div class="video-wrap" aria-hidden="true">
      <div class="ambient-fallback"></div>
    </div>
    <div class="wash"></div>
    <div class="grain"></div>

    <div class="rails-container">
      <!-- Columna 2 (Finanzas y Horarios - Izquierda) -->
      <section class="rail" aria-label="Finanzas y Horarios">
        <!-- Bitcoin Widget -->
        <article class="widget financial-widget">
          <div class="tradingview-widget-container" style="height: 100%; width: 100%;">
            <div class="tradingview-widget-container__widget" style="height: 100%; width: 100%;"></div>
            <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js" async>
            {
              "symbol": "BINANCE:BTCUSDT",
              "width": "100%",
              "height": "100%",
              "locale": "es",
              "dateRange": "1d",
              "colorTheme": "dark",
              "isTransparent": true,
              "autosize": true,
              "largeChartUrl": ""
            }
            </script>
          </div>
        </article>

        <!-- Tether Widget -->
        <article class="widget financial-widget">
          <div class="tradingview-widget-container" style="height: 100%; width: 100%;">
            <div class="tradingview-widget-container__widget" style="height: 100%; width: 100%;"></div>
            <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js" async>
            {
              "symbol": "COINBASE:USDTUSD",
              "width": "100%",
              "height": "100%",
              "locale": "es",
              "dateRange": "1d",
              "colorTheme": "dark",
              "isTransparent": true,
              "autosize": true,
              "largeChartUrl": ""
            }
            </script>
          </div>
        </article>

        <!-- Gold Share Widget -->
        <article class="widget financial-widget">
          <div class="tradingview-widget-container" style="height: 100%; width: 100%;">
            <div class="tradingview-widget-container__widget" style="height: 100%; width: 100%;"></div>
            <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js" async>
            {
              "symbol": "AMEX:GLD",
              "width": "100%",
              "height": "100%",
              "locale": "es",
              "dateRange": "1d",
              "colorTheme": "dark",
              "isTransparent": true,
              "autosize": true,
              "largeChartUrl": ""
            }
            </script>
          </div>
        </article>

        <!-- Relojes Mundiales Widget -->
        <article class="widget world-clocks">
          <div class="eyebrow">
            <span>Relojes Mundiales</span>
            <span class="live-dot" style="background: var(--accent); box-shadow: 0 0 18px var(--accent);"></span>
          </div>
          
          <!-- Nueva York -->
          <div class="world-clock-item">
            <div class="world-clock-info">
              <span class="world-clock-label">Nueva York</span>
              <span class="world-clock-date" id="ny-date">Cargando fecha...</span>
            </div>
            <div class="world-clock-time" id="ny-time">00:00:00</div>
          </div>
          
          <div class="world-clock-divider"></div>
          
          <!-- Wall Street Chino (Shanghái) -->
          <div class="world-clock-item">
            <div class="world-clock-info">
              <span class="world-clock-label">Shanghái</span>
              <span class="world-clock-date" id="china-date">Cargando fecha...</span>
            </div>
            <div class="world-clock-time" id="china-time">00:00:00</div>
          </div>
          
          <div class="world-clock-divider"></div>
          
          <!-- Ciudad de Guatemala -->
          <div class="world-clock-item">
            <div class="world-clock-info">
              <span class="world-clock-label">Ciudad de Guatemala</span>
              <span class="world-clock-date" id="guatemala-date">Cargando fecha...</span>
            </div>
            <div class="world-clock-time" id="guatemala-time">00:00:00</div>
          </div>
        </article>
      </section>

      <!-- Columna 1 (Principal - Derecha) -->
      <section class="rail" aria-label="Widgets Principales">
        <article class="widget clock">
          <div class="eyebrow">
            <span>Escritorio vivo</span>
            <span class="live-dot" aria-hidden="true"></span>
          </div>
          <div class="time" id="time">00:00</div>
          <div class="date" id="date">Cargando fecha</div>
        </article>

        <article class="widget calendar">
          <div class="calendar-head">
            <div class="calendar-title" id="monthTitle">Mes</div>
            <div class="calendar-actions">
              <button class="icon-button" id="prevMonth" type="button" title="Mes anterior"
                aria-label="Mes anterior">‹</button>
              <button class="icon-button" id="todayMonth" type="button" title="Hoy" aria-label="Volver a hoy">•</button>
              <button class="icon-button" id="nextMonth" type="button" title="Mes siguiente"
                aria-label="Mes siguiente">›</button>
            </div>
          </div>
          <div class="month-grid" id="monthGrid" aria-label="Calendario mensual"></div>
        </article>

        <article class="widget weather">
          <div class="weather-head">
            <div class="weather-title">Clima en Barcelona</div>
            <span class="live-dot" style="background: var(--accent); box-shadow: 0 0 18px var(--accent);"></span>
          </div>
          <div class="weather-body">
            <div class="weather-info">
              <div class="weather-main">
                <span class="weather-temp" id="weatherTemp">--°C</span>
                <div class="weather-status">
                  <span class="weather-desc" id="weatherDesc">Cargando...</span>
                  <span class="weather-date" id="weatherDay">Hoy</span>
                </div>
              </div>
              <div class="weather-icon" id="weatherIcon">⛅</div>
            </div>
            <div class="weather-details">
              <div class="w-detail">
                <span class="wd-label">Humedad</span>
                <span class="wd-val" id="weatherHumidity">--%</span>
              </div>
              <div class="w-detail">
                <span class="wd-label">Viento</span>
                <span class="wd-val" id="weatherWind">-- km/h</span>
              </div>
              <div class="w-detail">
                <span class="wd-label">Sensación</span>
                <span class="wd-val" id="weatherApparent">--°C</span>
              </div>
            </div>
            <div class="thermal-map-container">
              <iframe 
                id="thermalMap"
                src="https://node.windy.com/embed2.html?lat=41.385&lon=2.173&zoom=8&level=surface&overlay=temp&menu=&message=&marker=&calendar=&pressure=&type=map&location=coordinates&detail=&metricWind=default&metricTemp=default&radarRange=-1" 
                title="Mapa Térmico de Barcelona"
                allowfullscreen>
              </iframe>
            </div>
          </div>
        </article>
      </section>
    </div>

    <!-- Selector de Video de Fondo con Memoria -->
    <div class="video-control-pill" id="videoControlPill">
      <button class="video-pill-btn" id="videoToggleBtn" type="button" title="Videos de fondo en memoria" aria-haspopup="true" aria-expanded="false">
        <span class="video-pill-icon">✨</span>
        <span class="video-pill-title" id="videoPillTitle">Cozy Christmas Jazz</span>
        <span class="video-pill-arrow" id="videoPillArrow">▲</span>
      </button>
      <div class="video-pill-menu" id="videoPillMenu">
        <div class="video-pill-header">
          <span>Videos en Memoria</span>
          <span class="video-pill-badge" id="videoCountBadge">2 guardados</span>
        </div>
        <div class="video-pill-list" id="videoPillList"></div>
      </div>
    </div>
  </main>

  <script>
    const spanish = new Intl.DateTimeFormat("es-ES", {
      weekday: "long",
      day: "numeric",
      month: "long",
      year: "numeric"
    });

    const monthFormatter = new Intl.DateTimeFormat("es-ES", {
      month: "long",
      year: "numeric"
    });

    const timeNode = document.querySelector("#time");
    const dateNode = document.querySelector("#date");
    const monthTitle = document.querySelector("#monthTitle");
    const monthGrid = document.querySelector("#monthGrid");
    const videoWrap = document.querySelector(".video-wrap");

    const nyTimeNode = document.querySelector("#ny-time");
    const nyDateNode = document.querySelector("#ny-date");
    const chinaTimeNode = document.querySelector("#china-time");
    const chinaDateNode = document.querySelector("#china-date");
    const guatemalaTimeNode = document.querySelector("#guatemala-time");
    const guatemalaDateNode = document.querySelector("#guatemala-date");

    const nyTimeFormatter = new Intl.DateTimeFormat("es-ES", {
      timeZone: "America/New_York",
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
      hour12: false
    });

    const nyDateFormatter = new Intl.DateTimeFormat("es-ES", {
      timeZone: "America/New_York",
      weekday: "long",
      day: "numeric",
      month: "long"
    });

    const chinaTimeFormatter = new Intl.DateTimeFormat("es-ES", {
      timeZone: "Asia/Shanghai",
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
      hour12: false
    });

    const chinaDateFormatter = new Intl.DateTimeFormat("es-ES", {
      timeZone: "Asia/Shanghai",
      weekday: "long",
      day: "numeric",
      month: "long"
    });

    const guatemalaTimeFormatter = new Intl.DateTimeFormat("es-ES", {
      timeZone: "America/Guatemala",
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
      hour12: false
    });

    const guatemalaDateFormatter = new Intl.DateTimeFormat("es-ES", {
      timeZone: "America/Guatemala",
      weekday: "long",
      day: "numeric",
      month: "long"
    });

    let viewedMonth = new Date();
    viewedMonth.setDate(1);

    function pad(value) {
      return String(value).padStart(2, "0");
    }

    function capitalizeFirstLetter(str) {
      if (!str) return "";
      return str.charAt(0).toUpperCase() + str.slice(1);
    }

    function tick() {
      const now = new Date();
      timeNode.textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
      dateNode.textContent = spanish.format(now);

      // Actualizar relojes mundiales
      if (nyTimeNode && nyDateNode) {
        nyTimeNode.textContent = nyTimeFormatter.format(now);
        nyDateNode.textContent = capitalizeFirstLetter(nyDateFormatter.format(now));
      }
      if (chinaTimeNode && chinaDateNode) {
        chinaTimeNode.textContent = chinaTimeFormatter.format(now);
        chinaDateNode.textContent = capitalizeFirstLetter(chinaDateFormatter.format(now));
      }
      if (guatemalaTimeNode && guatemalaDateNode) {
        guatemalaTimeNode.textContent = guatemalaTimeFormatter.format(now);
        guatemalaDateNode.textContent = capitalizeFirstLetter(guatemalaDateFormatter.format(now));
      }
    }

    function sameDate(a, b) {
      return a.getFullYear() === b.getFullYear() &&
        a.getMonth() === b.getMonth() &&
        a.getDate() === b.getDate();
    }

    function renderCalendar() {
      const today = new Date();
      const year = viewedMonth.getFullYear();
      const month = viewedMonth.getMonth();
      const first = new Date(year, month, 1);
      const startOffset = (first.getDay() + 6) % 7;
      const gridStart = new Date(year, month, 1 - startOffset);
      const names = ["L", "M", "X", "J", "V", "S", "D"];

      monthTitle.textContent = monthFormatter.format(viewedMonth);
      monthGrid.replaceChildren();

      for (const name of names) {
        const node = document.createElement("div");
        node.className = "day-name";
        node.textContent = name;
        monthGrid.append(node);
      }

      for (let index = 0; index < 42; index += 1) {
        const date = new Date(gridStart);
        date.setDate(gridStart.getDate() + index);
        const node = document.createElement("div");
        node.className = "day";
        node.textContent = date.getDate();
        if (date.getMonth() !== month) node.classList.add("other");
        if (sameDate(date, today)) node.classList.add("today");
        monthGrid.append(node);
      }
    }

    function normalizeUrl(value) {
      const trimmed = value.trim();
      if (!trimmed) return "";
      return /^[a-z]+:\/\//i.test(trimmed) ? trimmed : `https://${trimmed}`;
    }

    // ==========================================
    // MEMORIA DE VIDEOS DE FONDO (PRESETS)
    // ==========================================
    // Video activo actual: 3kYf4OCStJ8 (Cozy Christmas Jazz)
    // Video anterior en memoria: PQoLr7eVLUI (Gradient Mood Lights)
    const VIDEO_MEMORY = [
      {
        id: "3kYf4OCStJ8",
        title: "Cozy Christmas Jazz",
        desc: "Winter Cafe Music & Study Focus",
        url: "https://youtu.be/3kYf4OCStJ8?si=54GChkwJOxNfdf4i",
        poster: "https://i.ytimg.com/vi/3kYf4OCStJ8/maxresdefault.jpg"
      },
      {
        id: "PQoLr7eVLUI",
        title: "Gradient Mood Lights",
        desc: "4K Smooth LED Lights Ambient",
        url: "https://www.youtube.com/watch?v=PQoLr7eVLUI",
        poster: "https://i.ytimg.com/vi/PQoLr7eVLUI/maxresdefault.jpg"
      }
    ];

    let currentVideoId = localStorage.getItem("interactive_wallpaper_video_id") || "3kYf4OCStJ8";
    if (!VIDEO_MEMORY.some(v => v.id === currentVideoId)) {
      currentVideoId = "3kYf4OCStJ8";
    }

    function renderVideoMenu() {
      const listNode = document.querySelector("#videoPillList");
      if (!listNode) return;
      listNode.innerHTML = "";

      VIDEO_MEMORY.forEach((video) => {
        const item = document.createElement("button");
        item.type = "button";
        item.className = "video-pill-item" + (video.id === currentVideoId ? " active" : "");
        item.innerHTML = `
          <img class="video-item-thumb" src="${video.poster}" alt="" loading="lazy">
          <div class="video-item-meta">
            <span class="video-item-name">${video.title}</span>
            <span class="video-item-desc">${video.desc}</span>
          </div>
          <span class="video-item-check">✓</span>
        `;
        item.addEventListener("click", () => {
          setBackgroundVideo(video.id);
          closeVideoMenu();
        });
        listNode.append(item);
      });

      const titleNode = document.querySelector("#videoPillTitle");
      const currentVideo = VIDEO_MEMORY.find(v => v.id === currentVideoId) || VIDEO_MEMORY[0];
      if (titleNode && currentVideo) {
        titleNode.textContent = currentVideo.title;
      }
    }

    function setBackgroundVideo(videoId) {
      currentVideoId = videoId;
      localStorage.setItem("interactive_wallpaper_video_id", videoId);

      const videoData = VIDEO_MEMORY.find(v => v.id === videoId) || VIDEO_MEMORY[0];

      // Actualizar poster en variable CSS
      document.documentElement.style.setProperty("--bg-poster", `url("${videoData.poster}")`);

      renderVideoMenu();

      if (location.protocol === "file:") return;

      const srcUrl = "https://www.youtube-nocookie.com/embed/" + videoId + "?autoplay=1&mute=1&loop=1&playlist=" + videoId + "&controls=0&showinfo=0&rel=0&modestbranding=1&playsinline=1&disablekb=1&fs=0&iv_load_policy=3&origin=" + encodeURIComponent(location.origin);

      let iframe = videoWrap.querySelector("iframe");
      if (!iframe) {
        iframe = document.createElement("iframe");
        iframe.title = "Video de fondo";
        iframe.allow = "autoplay; encrypted-media; picture-in-picture";
        iframe.referrerPolicy = "origin";
        iframe.src = srcUrl;
        videoWrap.append(iframe);
      } else {
        if (iframe.src !== srcUrl) {
          iframe.src = srcUrl;
        }
      }
    }

    function closeVideoMenu() {
      const menu = document.querySelector("#videoPillMenu");
      const pill = document.querySelector("#videoControlPill");
      const btn = document.querySelector("#videoToggleBtn");
      if (menu) menu.classList.remove("open");
      if (pill) pill.classList.remove("is-open");
      if (btn) btn.setAttribute("aria-expanded", "false");
    }

    function toggleVideoMenu() {
      const menu = document.querySelector("#videoPillMenu");
      const pill = document.querySelector("#videoControlPill");
      const btn = document.querySelector("#videoToggleBtn");
      if (!menu) return;
      const isOpen = menu.classList.toggle("open");
      if (pill) pill.classList.toggle("is-open", isOpen);
      if (btn) btn.setAttribute("aria-expanded", String(isOpen));
    }

    function initVideoControls() {
      const btn = document.querySelector("#videoToggleBtn");
      if (btn) {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          toggleVideoMenu();
        });
      }

      document.addEventListener("click", (e) => {
        const pill = document.querySelector("#videoControlPill");
        if (pill && !pill.contains(e.target)) {
          closeVideoMenu();
        }
      });

      renderVideoMenu();
      setBackgroundVideo(currentVideoId);
    }

    function mountVideoIfPossible() {
      initVideoControls();
    }

    document.querySelector("#prevMonth").addEventListener("click", () => {
      viewedMonth.setMonth(viewedMonth.getMonth() - 1);
      renderCalendar();
    });

    document.querySelector("#nextMonth").addEventListener("click", () => {
      viewedMonth.setMonth(viewedMonth.getMonth() + 1);
      renderCalendar();
    });

    document.querySelector("#todayMonth").addEventListener("click", () => {
      viewedMonth = new Date();
      viewedMonth.setDate(1);
      renderCalendar();
    });

    async function fetchWeather() {
      try {
        const response = await fetch("https://api.open-meteo.com/v1/forecast?latitude=41.3851&longitude=2.1734&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weather_code,wind_speed_10m&timezone=Europe/Madrid");
        if (!response.ok) throw new Error("API error");
        const data = await response.json();
        
        const current = data.current;
        const temp = Math.round(current.temperature_2m);
        const apparent = Math.round(current.apparent_temperature);
        const humidity = current.relative_humidity_2m;
        const wind = Math.round(current.wind_speed_10m);
        const code = current.weather_code;

        document.querySelector("#weatherTemp").textContent = `${temp}°C`;
        document.querySelector("#weatherApparent").textContent = `${apparent}°C`;
        document.querySelector("#weatherHumidity").textContent = `${humidity}%`;
        document.querySelector("#weatherWind").textContent = `${wind} km/h`;

        let desc = "Despejado";
        let icon = "☀️";
        
        const wmo = {
          0: { desc: "Despejado", icon: "☀️" },
          1: { desc: "Mayormente despejado", icon: "🌤️" },
          2: { desc: "Parcialmente nublado", icon: "⛅" },
          3: { desc: "Nublado", icon: "☁️" },
          45: { desc: "Niebla", icon: "🌫️" },
          48: { desc: "Niebla escarcha", icon: "🌫️" },
          51: { desc: "Llovizna ligera", icon: "🌧️" },
          53: { desc: "Llovizna moderada", icon: "🌧️" },
          55: { desc: "Llovizna densa", icon: "🌧️" },
          61: { desc: "Lluvia ligera", icon: "🌧️" },
          63: { desc: "Lluvia moderada", icon: "🌧️" },
          65: { desc: "Lluvia fuerte", icon: "🌧️" },
          71: { desc: "Nevada ligera", icon: "❄️" },
          73: { desc: "Nevada moderada", icon: "❄️" },
          75: { desc: "Nevada fuerte", icon: "❄️" },
          80: { desc: "Chubascos ligeros", icon: "🌦️" },
          81: { desc: "Chubascos moderados", icon: "🌦️" },
          82: { desc: "Chubascos violentos", icon: "🌦️" },
          95: { desc: "Tormenta", icon: "⛈️" },
          96: { desc: "Tormenta con granizo", icon: "⛈️" },
          99: { desc: "Tormenta fuerte", icon: "⛈️" }
        };

        if (wmo[code]) {
          desc = wmo[code].desc;
          icon = wmo[code].icon;
        }

        if (!current.is_day && code <= 1) {
          icon = "🌙";
        }

        document.querySelector("#weatherDesc").textContent = desc;
        document.querySelector("#weatherIcon").textContent = icon;
        
        const options = { weekday: 'long', day: 'numeric', month: 'short' };
        document.querySelector("#weatherDay").textContent = new Date().toLocaleDateString('es-ES', options);

      } catch (err) {
        console.error("Error fetching weather:", err);
        document.querySelector("#weatherDesc").textContent = "Error al cargar";
      }
    }

    fetchWeather();
    setInterval(fetchWeather, 15 * 60 * 1000);

    mountVideoIfPossible();
    tick();
    renderCalendar();
    setInterval(tick, 1000);
  </script>
</body>

</html>
